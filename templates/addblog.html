{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать пост</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .form-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .form-card h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-card .sub {
            text-align: center;
            color: #6b7280;
            margin-bottom: 24px;
        }
        .form-card input, .form-card textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 16px;
        }
        .form-card input:focus, .form-card textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        .form-card button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .form-card button:hover {
            transform: scale(1.02);
        }
        .form-card .link {
            text-align: center;
            margin-top: 16px;
            color: #6b7280;
        }
        .form-card .link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .form-card .link a:hover {
            text-decoration: underline;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .checkbox-group input {
            width: 20px;
            height: 20px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <h1>✏️ Создать пост</h1>
        <p class="sub">Заполните форму и опубликуйте свою статью</p>

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="title" placeholder="Заголовок" required>
            <textarea name="desc" rows="4" placeholder="Описание" required></textarea>
            <input type="text" name="category" placeholder="Категория (например: programming)">
            <input type="text" name="tags" placeholder="Теги (через запятую, например: python, django)">
            <input type="url" name="thumbnail" placeholder="Ссылка на картинку (URL)">
            
            <div class="checkbox-group">
                <input type="checkbox" name="is_private" id="is_private">
                <label for="is_private">🔒 Сделать пост приватным (только по запросу)</label>
            </div>
            
            <button type="submit">Опубликовать</button>
        </form>

        <div class="link">
            <a href="{% url 'home' %}">← На главную</a>
        </div>
    </div>
</body>
</html>
