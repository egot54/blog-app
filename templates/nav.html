<<script src="https://cdn.tailwindcss.com"></script>
<div class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center">
    <nav class="md:ml-auto md:mr-auto flex flex-wrap items-center text-base justify-center">
        <a href="{% url 'home' %}" class="text-white hover:text-gray-300 mx-1.5 sm:mx-6">Home</a>
        {% if user.is_authenticated %}
            <a href="{% url 'addblog' %}" class="text-white hover:text-gray-300 mx-1.5 sm:mx-6">Post Blog</a>
            <a href="{% url 'logout' %}" class="text-white hover:text-gray-300 mx-1.5 sm:mx-6">LogOut</a>
        {% else %}
            <a href="{% url 'login' %}" class="text-white hover:text-gray-300 mx-1.5 sm:mx-6">Login</a>
            <a href="{% url 'register' %}" class="text-white hover:text-gray-300 mx-1.5 sm:mx-6">Register</a>
        {% endif %}
    </nav>
</div>
